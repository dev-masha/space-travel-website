<!DOCTYPE html>
<html>
<head>
  <title>Destination - Space Travel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .planet { display: none; text-align: center; }
    .planet.active { display: block; }
    .planet img { width: 250px; margin: 20px auto; display: block; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">HOME</a>
    <a href="destination.html">DESTINATION</a>
  </nav>

  <div class="tab-buttons">
    <button onclick="showPlanet('moon')">MOON</button>
    <button onclick="showPlanet('mars')">MARS</button>
    <button onclick="showPlanet('europa')">EUROPA</button>
    <button onclick="showPlanet('titan')">TITAN</button>
  </div>

  <div id="moon" class="planet active">
    <img src="moon.png">
    <h1>MOON</h1>
    <p>See our planet as you've never seen it before.</p>
  </div>

  <div id="mars" class="planet">
    <img src="mars.png">
    <h1>MARS</h1>
    <p>Don't forget to pack your hiking boots.</p>
  </div>

  <div id="europa" class="planet">
    <img src="europa.png">
    <h1>EUROPA</h1>
    <p>The smallest of the four Galilean moons.</p>
  </div>

  <div id="titan" class="planet">
    <img src="titan.png">
    <h1>TITAN</h1>
    <p>The only moon known to have a dense atmosphere.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
